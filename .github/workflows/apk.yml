name: apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 環境の下ごしらえ
        run: |
          set -x
          java -version
          python3 -V
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            if command -v sdkmanager >/dev/null; then
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager "platforms;android-34" "build-tools;34.0.0"
            elif command -v android >/dev/null; then
              android sdk install "platforms;android-34" "build-tools;34.0.0" || true
            fi
          fi
          # 改行コードを LF に揃える（CRLF 対策）
          sed -i 's/\r$//' make-bundle.sh
          file make-bundle.sh
          head -1 make-bundle.sh
          bash -n make-bundle.sh

      - name: ソース生成
        run: bash make-bundle.sh

      - name: 再起動レシーバを登録
        run: |
          cd fakegps-tier1
          python3 - <<'PY'
          import pathlib
          mf = next(pathlib.Path("app/src/main").glob("AndroidManifest.xml"))
          s = mf.read_text()
          if 'android:name=".BootReceiver"' not in s:
              s = s.replace("</application>",
                  '        <receiver android:name=".BootReceiver" android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n    </application>')
              mf.write_text(s)
          PY

      - name: APK ビルド
        run: |
          cd fakegps-tier1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: fakegps-tier1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
