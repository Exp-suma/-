name: apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 準備
        run: |
          set -x
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SDKM=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKM" ]; then
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/clt && unzip -q /tmp/clt.zip -d /tmp/clt
            SDKM="$(find /tmp/clt -name sdkmanager -type f | head -1)"
            chmod +x "$SDKM"
          fi
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

     - name: 生成とビルド
        run: |
          set -x
          sed -i 's/\r$//' make-bundle.sh
          bash make-bundle.sh 2>&1 | tee bundle.log
          cd fakegps-tier1
          python3 - <<'PY'
          import pathlib
          mf = next(pathlib.Path("app/src/main").glob("AndroidManifest.xml"))
          mf.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.ACCESS_MOCK_LOCATION" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_pin"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.FakeGps">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MockLocationService"
                      android:exported="false"
                      android:foregroundServiceType="location" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ''')
          PY
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee ../gradle.log

      - name: ログ抜粋をサマリに出す
        if: always()
        run: |
          {
            echo '## エラー行'
            echo '```'
            grep -nE '^e: |error:|FAILURE:|What went wrong|Failed to find|Caused by|Could not|Execution failed' gradle.log 2>/dev/null | head -40 || echo '(該当なし)'
            echo '```'
            echo '## gradle.log 末尾'
            echo '```'
            tail -n 60 gradle.log 2>/dev/null || echo '(なし)'
            echo '```'
            echo '## bundle.log 末尾'
            echo '```'
            tail -n 30 bundle.log 2>/dev/null || echo '(なし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
