name: apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 準備
        run: |
          set -x
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SDKM=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKM" ]; then
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/clt && unzip -q /tmp/clt.zip -d /tmp/clt
            SDKM="$(find /tmp/clt -name sdkmanager -type f | head -1)"
            chmod +x "$SDKM"
          fi
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: 生成とビルド
        run: |
          set -x
          sed -i 's/\r$//' make-bundle.sh
          bash make-bundle.sh 2>&1 | tee bundle.log
          cd fakegps-tier1
          python3 - <<'PY'
          import pathlib
          mf = next(pathlib.Path("app/src/main").glob("AndroidManifest.xml"))
          s = mf.read_text()
          if 'android:name=".BootReceiver"' not in s:
              s = s.replace("</application>",
                  '        <receiver android:name=".BootReceiver" android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n    </application>')
              mf.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee ../gradle.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: logs-and-apk
          path: |
            bundle.log
            gradle.log
            fakegps-tier1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 3
