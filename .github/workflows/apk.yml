name: apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 準備
        run: |
          set -x
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SDKM=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKM="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKM" ]; then
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/clt && unzip -q /tmp/clt.zip -d /tmp/clt
            SDKM="$(find /tmp/clt -name sdkmanager -type f | head -1)"
            chmod +x "$SDKM"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$SDK/platforms" || true

      - name: 生成とビルド
        run: |
          set -x
          sed -i 's/\r$//' make-bundle.sh
          bash make-bundle.sh 2>&1 | tee bundle.log
          cp ci/AndroidManifest.xml fakegps-tier1/app/src/main/AndroidManifest.xml
          cd fakegps-tier1
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee ../gradle.log

      - name: ログ抜粋をサマリに出す
        if: always()
        run: |
          {
            echo '## エラー行'
            echo '```'
            grep -nE '^e: |error:|FAILURE:|What went wrong|Failed to find|Caused by|Could not|Execution failed' gradle.log 2>/dev/null | head -40 || echo '(該当なし)'
            echo '```'
            echo '## gradle.log 末尾'
            echo '```'
            tail -n 60 gradle.log 2>/dev/null || echo '(なし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-and-apk
          path: |
            bundle.log
            gradle.log
            fakegps-tier1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 3
